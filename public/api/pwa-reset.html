<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <title>Atualizando a aplicação</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        background: #f5f7fa;
        color: #16281f;
      }
      main {
        width: 100%;
        max-width: 420px;
        background: #ffffff;
        border: 1px solid #dde5e0;
        border-radius: 14px;
        padding: 28px 24px;
        text-align: center;
      }
      h1 { font-size: 1.25rem; margin: 0 0 10px; }
      p { margin: 0 0 8px; line-height: 1.5; font-size: 0.95rem; }
      .muted { color: #55665d; }
      .spinner {
        width: 34px; height: 34px; margin: 0 auto 18px;
        border: 3px solid #d7e3db; border-top-color: #0a6b3a; border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
      button {
        margin-top: 16px; width: 100%; padding: 12px 16px; font-size: 1rem;
        border: 0; border-radius: 10px; background: #0a6b3a; color: #ffffff; cursor: pointer;
      }
      button:focus-visible { outline: 3px solid #0a6b3a; outline-offset: 2px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <div class="spinner" aria-hidden="true"></div>
      <h1 id="titulo">Atualizando a aplicação</h1>
      <div id="status" role="status" aria-live="polite">
        <p>Estamos concluindo a atualização desta instalação.</p>
        <p class="muted">Seus dados e sua sessão não serão apagados. Aguarde alguns segundos.</p>
      </div>
      <div id="erro" hidden>
        <p>Não foi possível concluir a atualização automaticamente.</p>
        <button id="retry" type="button">Tentar novamente</button>
      </div>
    </main>
    <script>
      (function () {
        var statusEl = document.getElementById("status");
        var erroEl = document.getElementById("erro");
        var retryEl = document.getElementById("retry");

        function falhar() {
          statusEl.hidden = true;
          erroEl.hidden = false;
          retryEl.focus();
        }

        function limpar() {
          erroEl.hidden = true;
          statusEl.hidden = false;

          var tarefas = [];

          if ("serviceWorker" in navigator) {
            tarefas.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(
                  regs.map(function (reg) {
                    return reg.unregister();
                  })
                );
              })
            );
          }

          if (window.caches && caches.keys) {
            tarefas.push(
              caches.keys().then(function (chaves) {
                return Promise.all(
                  chaves.map(function (chave) {
                    return caches.delete(chave);
                  })
                );
              })
            );
          }

          Promise.all(tarefas)
            .then(function () {
              location.replace("/auth?pwa=migrated");
            })
            .catch(falhar);
        }

        retryEl.addEventListener("click", limpar);
        limpar();
      })();
    </script>
  </body>
</html>
