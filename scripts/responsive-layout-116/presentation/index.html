<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cultivo Farm — Evidências responsivas</title><link rel="stylesheet" href="/src/index.css"><style>body{margin:0;font-family:system-ui;background:hsl(var(--background));color:hsl(var(--foreground))}main{max-width:1100px;margin:auto;padding:24px}section{border-top:1px solid hsl(var(--border));padding:24px 0}h1,h2{overflow-wrap:anywhere}figure{margin:0}img{max-width:100%;max-height:600px;object-fit:contain;object-position:top;display:block}.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}a{color:hsl(var(--primary))}pre{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:600px){.pair{grid-template-columns:1fr}}</style></head><body><main><h1>Revisão responsiva — 116 ocorrências</h1><p>Evidência local sintética. Montagem isolada e navegação real são distintas; lacunas não significam aprovação.</p><a href="MATRIX.json">Abrir matriz completa</a> · <a href="REPORT.md">Relatório e limites</a><pre id="summary"></pre><section><h2>Alvos em lote</h2><div class="pair"><figure><figcaption>Antes</figcaption><img src="before-bulk-320-tab2.png" alt="Aba cortada antes da correção"></figure><figure><figcaption>Depois</figcaption><img src="final-bulk-320-tab2.png" alt="Aba completa com rolagem local"></figure></div></section><section><h2>Evidências da visita</h2><div class="pair"><figure><figcaption>Antes</figcaption><img src="before-evidence-320-tab3.png" alt="Abas sobrepostas"></figure><figure><figcaption>Depois</figcaption><img src="after-evidence-320-tab3.png" alt="Última aba acessível sem sobreposição"></figure></div></section><section><h2>Novo usuário</h2><div class="pair"><figure><figcaption>Antes</figcaption><img src="before-config-1440-tab2.png" alt="Descrições fora das opções"></figure><figure><figcaption>Depois</figcaption><img src="after-config-1440-tab2.png" alt="Opções completas e empilhadas"></figure></div></section><section><h2>Registro de entrega</h2><div class="pair"><figure><figcaption>Antes</figcaption><img src="before-delivery-320.png" alt="Abas da entrega sobrepostas"></figure><figure><figcaption>Depois</figcaption><img src="delivery-final-delivery-320-tab1.png" alt="Última aba da entrega completa"></figure></div></section></main><script>fetch('MATRIX.json').then(r=>r.json()).then(m=>{document.getElementById('summary').textContent=JSON.stringify(m.summary,null,2)})</script></body></html>
