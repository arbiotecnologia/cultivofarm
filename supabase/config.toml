[functions.enviar-pdf-visita]
verify_jwt = true

[functions.sync-clima]
verify_jwt = true

[functions.onboarding-cnpj-lookup]
verify_jwt = false

# Troca de e-mail de administrador provisionado: JWT no gateway e Superadmin
# revalidado em código; service_role somente dentro da função.
[functions.platform-org-admin-email-change]
verify_jwt = true

# SMTP por empresa (F4b). Configurações por empresa: JWT obrigatório no gateway + Admin revalidado em código.
[functions.tenant-email-settings]
verify_jwt = true

# Processador da outbox: a rota ?lane=tenant_smtp autentica SOMENTE pelo header dedicado
# x-tenant-smtp-secret (TENANT_SMTP_LANE_INVOKER_SECRET); a rota global mantém a autorização em código.
# JWT de gateway desligado apenas aqui, porque o invocador (pg_cron/pg_net) não envia JWT.
[functions.process-communication-outbox]
verify_jwt = false

# Incidente 2026-10-21: publicação recriou v2 sem JWT no gateway.
# Fixar a proteção restaurada externamente em v3 para evitar recorrência.
[functions.download-client-document]
verify_jwt = true

# Candidata financial-docs (não implantada): JWT obrigatório explícito antes do primeiro deploy,
